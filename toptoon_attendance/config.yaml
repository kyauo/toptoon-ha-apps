name: "Toptoon Attendance"
description: "Automatically checks in to Toptoon, retries failures, and notifies Home Assistant."
version: "0.2.0"
slug: "toptoon_attendance"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
homeassistant_api: true

options:
  phpsessid: ""
  rm_session: ""
  run_time: "00:15"
  timezone: "Asia/Seoul"
  retry_1_minutes: 5
  retry_2_minutes: 15
  mobile_alert_time: "09:05"
  mobile_notify_entity: "notify.ky17"
  run_on_start: false
  notify_on_failure: true

schema:
  phpsessid: password
  rm_session: password
  run_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  retry_1_minutes: "int(1,180)"
  retry_2_minutes: "int(1,360)"
  mobile_alert_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  mobile_notify_entity: str
  run_on_start: bool
  notify_on_failure: bool
