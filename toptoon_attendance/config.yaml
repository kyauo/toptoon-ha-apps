name: "Toptoon Attendance"
description: "Automatically checks in to Toptoon once a day using an existing login session."
version: "0.1.0"
slug: "toptoon_attendance"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
homeassistant_api: true

options:
  phpsessid: ""
  rm_session: ""
  run_time: "09:05"
  timezone: "Asia/Seoul"
  run_on_start: false
  notify_on_login_expiry: true

schema:
  phpsessid: password
  rm_session: password
  run_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  run_on_start: bool
  notify_on_login_expiry: bool
