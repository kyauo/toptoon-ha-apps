name: "Toptoon Attendance Bot"
description: "Automatically checks in to Toptoon with a persistent Chromium login session, retries failures, and notifies Home Assistant."
version: "0.5.13"
slug: "toptoon_attendance"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: "/"
ingress_stream: true
panel_icon: "mdi:calendar-check"
panel_title: "Toptoon Attendance"
panel_admin: true

options:
  run_time: "00:30"
  timezone: "Asia/Seoul"
  retry_1_minutes: 5
  retry_2_minutes: 15
  mobile_alert_time: "09:05"
  manual_reminder_time: "21:00"
  mobile_notify_entity: "notify.ky17"
  run_on_start: false
  notify_on_failure: true
  notify_on_success: true
  notify_manual_reminder: true

schema:
  run_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  retry_1_minutes: "int(1,180)"
  retry_2_minutes: "int(1,360)"
  mobile_alert_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  manual_reminder_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  mobile_notify_entity: str
  run_on_start: bool
  notify_on_failure: bool
  notify_on_success: bool
  notify_manual_reminder: bool
